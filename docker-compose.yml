version: '3.8'

services:
  mongo:
    image: mongo:6
    container_name: notes-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notes-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/notesapp
      - JWT_SECRET=change_this_secret_in_production
      - JWT_EXPIRES_IN=7d
      - CLIENT_ORIGIN=*
    depends_on:
      - mongo

  frontend:
    image: nginx:alpine
    container_name: notes-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend

volumes:
  mongo-data:
