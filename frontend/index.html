<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CloudNotes</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Auth Screen -->
  <div id="auth-screen" class="auth-screen">
    <div class="auth-card">
      <h1 class="logo">☁️ CloudNotes</h1>
      <div class="tabs">
        <button class="tab-btn active" data-tab="login">Login</button>
        <button class="tab-btn" data-tab="register">Register</button>
      </div>

      <form id="login-form" class="auth-form">
        <input type="email" id="login-email" placeholder="Email" required />
        <input type="password" id="login-password" placeholder="Password" required />
        <button type="submit">Login</button>
        <p class="error" id="login-error"></p>
      </form>

      <form id="register-form" class="auth-form hidden">
        <input type="text" id="register-name" placeholder="Full Name" required />
        <input type="email" id="register-email" placeholder="Email" required />
        <input type="password" id="register-password" placeholder="Password (min 6 chars)" required />
        <button type="submit">Create Account</button>
        <p class="error" id="register-error"></p>
      </form>
    </div>
  </div>

  <!-- Main App Screen -->
  <div id="app-screen" class="app-screen hidden">
    <header class="app-header">
      <h1 class="logo">☁️ CloudNotes</h1>
      <div class="header-right">
        <input type="text" id="search-input" placeholder="Search notes..." />
        <span id="user-name"></span>
        <button id="logout-btn">Logout</button>
      </div>
    </header>

    <main class="app-main">
      <section class="note-editor">
        <input type="text" id="note-title" placeholder="Note title" />
        <textarea id="note-content" placeholder="Write your note..." rows="4"></textarea>
        <div class="editor-row">
          <input type="text" id="note-tags" placeholder="tags (comma separated)" />
          <input type="color" id="note-color" value="#ffffff" />
          <button id="save-note-btn">+ Add Note</button>
        </div>
        <input type="hidden" id="editing-note-id" />
      </section>

      <section id="notes-grid" class="notes-grid">
        <!-- notes render here -->
      </section>
      <p id="empty-state" class="empty-state hidden">No notes yet. Create your first note above!</p>
    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
